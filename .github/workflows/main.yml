name: Sync Fork

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 每天2点（北京时间10点）自动同步
  workflow_dispatch:      # 可以手动点按钮立即运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/PVE-Tools/PVE-Tools-9.git # 上游地址
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push
